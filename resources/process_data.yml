resources:
  jobs:
    data-pipeline:
      name: arxiv-data-pipeline
      schedule:
        quartz_cron_expression: "0 0 6 * * ?"
        timezone_id: "Europe/Amsterdam"
        pause_status: "${var.schedule_pause_status}"
      budget_policy_id: "${var.usage_policy_id}"
      environments:
        - environment_key: default
          spec:
            environment_version: "5"
            dependencies:
              - ../dist/*.whl

      tasks:
        - task_key: process_data
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/process_data.py
            base_parameters:
              env: "${bundle.target}"

        - task_key: sync_lakebase
          depends_on:
            - task_key: process_data
          environment_key: default
          notebook_task:
            notebook_path: deployment_scripts/sync_lakebase.py
            base_parameters:
              env: "${bundle.target}"
